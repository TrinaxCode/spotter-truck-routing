<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Compare truck routes by wind, rain and snow risk, hour by hour along the corridor."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Weather-aware truck routing</title>
    <script>
      // Dark first; the light theme follows prefers-color-scheme unless the driver picked one.
      try {
        var stored = localStorage.getItem("headwind-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      /* Paint the first frame in the right theme before the stylesheet arrives. */
      html[data-theme="dark"] { background: #0b1017; color-scheme: dark; }
      html[data-theme="light"] { background: #e9edf2; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
