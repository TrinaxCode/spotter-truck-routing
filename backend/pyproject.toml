[project]
name = "spotter-backend"
version = "0.1.0"
description = "Weather-aware truck route planning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<6", "djangorestframework>=3.16,<4",
  "django-cors-headers>=4.7,<5", "whitenoise>=6.9,<7",
  "gunicorn>=23,<24", "requests>=2.32,<3", "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "responses>=0.25,<1", "ruff>=0.11,<1", "freezegun>=1.5,<2"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.testing"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
